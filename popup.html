<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Focus Mode</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 260px;
      padding: 16px;
      background: #1e1e1e;
      color: #f0f0f0;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 600;
    }
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      background: #2a2a2a;
      color: #f0f0f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    input[type="number"] { margin-bottom: 12px; }
    input[type="number"]:focus,
    select:focus,
    textarea:focus { border-color: #6c8cff; }
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }
    #startBtn { background: #3d6cff; }
    #startBtn:hover { background: #2f5ae0; }
    #stopBtn { background: #3a3a3a; }
    #stopBtn:hover { background: #4a4a4a; }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #9a9a9a;
      text-align: center;
      min-height: 18px;
    }
    #status.active { color: #6cd07a; }
    .field { display: block; margin-top: 12px; }
    .field > span {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #b8b8b8;
    }
    textarea { resize: vertical; min-height: 72px; }
    .hint {
      margin: 6px 0 0;
      font-size: 11px;
      color: #7a7a7a;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Focus Mode</h1>
  <input id="minutes" type="number" min="1" max="600" value="25" placeholder="Минуты">
  <button id="startBtn">Включить фокус</button>
  <button id="stopBtn">Выключить</button>
  <div id="status"></div>

  <label class="field">
    <span>Режим блокировки</span>
    <select id="mode">
      <option value="all">Блокировать всё</option>
      <option value="list">Только список</option>
    </select>
  </label>

  <label class="field">
    <span id="sitesLabel">Исключения (по одному в строке)</span>
    <textarea id="sites" placeholder="example.com"></textarea>
  </label>
  <p class="hint" id="sitesHint"></p>

  <script src="popup.js"></script>
</body>
</html>
